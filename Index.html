<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BA English Voice Notes</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:sans-serif;background:#f4f1ea;color:#222;padding:12px}
h1{font-size:20px;text-align:center;margin:6px 0}
.bar{display:flex;gap:8px;margin:10px 0}
input[type=text]{flex:1;min-width:0;padding:12px;font-size:16px;border:2px solid #1565c0;border-radius:10px}
button{border:0;border-radius:10px;padding:12px 14px;font-size:16px;color:#fff;background:#1565c0}
#mic{background:#d32f2f}
#mic.on{background:#2e7d32;animation:p 1s infinite}
@keyframes p{50%{opacity:.5}}
select{padding:8px;border-radius:8px}
.row{display:flex;gap:8px;align-items:center;font-size:14px;flex-wrap:wrap}
.note{background:#fff;border-left:6px solid #d32f2f;border-radius:10px;padding:12px;margin:12px 0;
      line-height:1.6;box-shadow:0 1px 4px #0002}
.note h3{margin:0 0 6px;color:#d32f2f}
.note li{color:#1a3c8f}
.q{color:#666;font-size:13px}
#status{font-size:14px;color:#555;margin:4px 0;min-height:18px}
</style>
</head>
<body>
<h1>📚 BA English – Voice Notes</h1>

<div class="row">
  Bolne ki language:
  <select id="lang">
    <option value="en-IN">English / Hinglish</option>
    <option value="hi-IN">Hindi</option>
  </select>
  <label><input type="checkbox" id="speak" checked> Bol kar sunao</label>
</div>

<div class="bar">
  <input type="text" id="txt" placeholder="Topic likho: Chaucer, Romantic poetry...">
  <button onclick="ask(txt.value)">Go</button>
  <button id="mic" onclick="toggleMic()">🎤</button>
</div>
<div id="status"></div>
<div id="out"></div>

<script>
// ===== NOTES DATABASE =====
// t = title, k = keywords (jo bologe usme se match hoga), n = notes
const DB = [
{t:"Feudalism & the Medieval World",k:["feudal","feudalism","medieval","middle ages"],
 n:["Feudalism = land ke badle service aur loyalty ka system.","King → Lords/Barons → Knights → Serfs (peasants).","Church ka bahut bada power tha; society 'three estates' me bati thi: clergy, nobles, peasants.","Norman Conquest (1066) ke baad England me feudal system strong hua."]},
{t:"Chivalry, Religion & Oral Traditions",k:["chivalry","chivalric","knight","oral","oral tradition","religion","ballad","beowulf"],
 n:["Chivalry = knights ka code: bravery, loyalty, honour, courtesy to ladies.","Religion (Christianity) ne medieval life aur literature dono ko shape kiya.","Oral tradition: kahaniya bolkar sunai jati thi - bards, minstrels, ballads.","Example: Beowulf (oral epic), Arthurian romances, Sir Gawain and the Green Knight."]},
{t:"Geoffrey Chaucer",k:["chaucer","canterbury","wife of bath","father of english poetry"],
 n:["'Father of English Poetry'; 14th century poet.","Major work: The Canterbury Tales - 29+ pilgrims ki kahaniya, Tabard Inn se Canterbury tak.","General Prologue me pilgrims ka satirical portrait hai (Knight, Wife of Bath, Miller, Pardoner).","Heroic couplet ka early use; Middle English me likha. Other works: Troilus and Criseyde, The Parliament of Fowls."]},
{t:"William Langland",k:["langland","piers","plowman","ploughman"],

{t:"John Gower",k:["gower","confessio","amantis"],

{t:"Satire: Dryden, Pope, Swift",k:["satire","satirical","dryden","pope","swift","gulliver","rape of the lock","neoclassical","augustan"],
 n:["Satire = vice aur folly ko mazaak/irony se expose karna.","Dryden: Absalom and Achitophel, MacFlecknoe (mock-heroic).","Pope: The Rape of the Lock (mock-epic), An Essay on Man, heroic couplets.","Swift: Gulliver's Travels, A Modest Proposal (Juvenalian satire).","Age: Augustan age (early 18th century)."]},
{t:"Defoe & the Rise of the Novel",k:["defoe","robinson","crusoe","rise of the novel","richardson","fielding","pamela","tom jones","novel"],
 n:["Novel ka rise 18th century me middle class reading public ke saath hua.","Defoe: Robinson Crusoe (1719), Moll Flanders - realism, first-person narrative.","Richardson: Pamela (epistolary novel). Fielding: Tom Jones (comic epic in prose).","Ian Watt ki book 'The Rise of the Novel' important hai."]},

 n:["18th-19th c. Britain me shuru; steam engine, factories, railways.","Villages se cities ki taraf migration, urban poverty, child labour.","Literature par asar: Dickens, Blake ('dark Satanic mills'), Elizabeth Gaskell (social novels).","Capitalism aur new middle class ka growth."]},

 n:["Period: ~1798-1832; Lyrical Ballads (1798) by Wordsworth & Coleridge se start.","Features: nature, imagination, emotion, individual, common man, past ki yaad.","Wordsworth: 'poetry is spontaneous overflow of powerful feelings'.","Big six: Blake, Wordsworth, Coleridge, Byron, Shelley, Keats.","French Revolution ka bada influence."]},

 n:["Jane Austen: Pride and Prejudice (social comedy, marriage, class).","Brontes: Jane Eyre, Wuthering Heights.","Dickens: Oliver Twist, Great Expectations (social reform).","George Eliot: Middlemarch. Thomas Hardy: Tess (fate, pessimism).","Serial publication aur realism is period ki features hain."]},

 n:["Early 20th c.; purani traditions se break - 'Make it new' (Pound).","Features: fragmentation, experimentation, alienation, loss of faith, stream of consciousness.","T.S. Eliot: The Waste Land (1922). Joyce: Ulysses. Woolf: Mrs Dalloway. Yeats: The Second Coming.","Drama: Beckett, Shaw, Pinter (later)."]},
{t:"World Wars, Psychoanalysis, Decline of Empire, Technology",k:["world war","world wars","wars","psychoanalysis","freud","jung","decline of empire","technological","technology"],
 n:["WWI aur WWII ne disillusionment aur trauma diya - War Poets (Owen, Sassoon, Brooke).","Freud: unconscious mind, dreams, repression; Jung: collective unconscious - writers par bada asar.","British Empire ka decline (esp. after 1947 India independence).","Technology: cars, radio, cinema, bombs - modern life ka tempo badla."]},
{t:"The 'Woman Question' & Gender Studies",k:["woman question","women","gender","feminism","feminist","wollstonecraft","room of one's own"],
 n:["19th c. debate: women ke rights - education, vote, property, marriage.","Mary Wollstonecraft: A Vindication of the Rights of Woman (1792).","Virginia Woolf: A Room of One's Own - 'money and a room of her own'.","Feminism ki waves aur gender studies ne literature ko naye nazariye se padha."]},
{t:"Popular Culture & Literature",k:["popular culture","pop culture","popular literature","detective","crime","science fiction"],
 n:["Mass readership, cinema, radio, TV, comics ne literature ke saath-saath popular genres banaye.","Genres: detective (Conan Doyle, Christie), sci-fi (H.G. Wells), fantasy (Tolkien).","High vs low culture ki bahas."]},
{t:"Migration, Consumerism & Globalization",k:["migration","migrant","consumerism","globalization","globalisation","diaspora"],
 n:["Post-war migration (Caribbean, South Asia) se Britain multicultural bana.","Diaspora writers: Salman Rushdie, Zadie Smith, Monica Ali.","Consumerism aur globalization ka asar identity, culture aur language par."]},
{t:"Postmodern & Contemporary Literature",k:["postmodern","postmodernism","contemporary","metafiction","magic realism"],
 n:["Post-1945; truth aur grand narratives par shak.","Features: metafiction, intertextuality, pastiche, irony, fragmentation.","Writers: Rushdie (Midnight's Children), Angela Carter, Julian Barnes, Ian McEwan.","Jean-François Lyotard: 'incredulity toward metanarratives'."]},
{t:"The Norman Conquest",k:["norman","conquest","1066","hastings"],
 n:["1066: William the Conqueror ne Harold ko Battle of Hastings me haraya.","French/Latin ka influence English par - nayi vocabulary.","Old English → Middle English ka transition shuru.","Feudal system strong hua."]},
{t:"Dream Allegory",k:["dream allegory","allegory","dream vision","pearl","romance of the rose"],
 n:["Poem jisme narrator sapne me symbolic story dekhta hai.","Examples: Piers Plowman, The Pearl, Chaucer's Book of the Duchess.","Moral/religious meaning chhupa hota hai."]},
{t:"Courtly Love",k:["courtly love","courtly","troubadour"],
 n:["Medieval concept: knight apni (aksar married) lady ke liye ideal, secret, devoted love rakhta hai.","Origin: troubadours of Provence (France).","Lady = unattainable; lover = servant. Example: Chaucer's Troilus and Criseyde, Arthurian romances."]},
{t:"Mystery & Morality Plays, Interludes",k:["mystery play","mystery plays","miracle play","morality play","morality plays","interlude","interludes","everyman","medieval drama"],
 n:["Mystery/Miracle plays: Bible stories (Creation, Noah, Nativity) guilds ne perform kiye.","Morality plays: virtues vs vices allegory; Everyman sabse famous (death aur good deeds).","Interludes: short comic plays, John Heywood; Elizabethan drama ka bridge."]},
{t:"University Wits",k:["university wits","wits","kyd","lyly","greene","peele","nashe","marlowe"],
 n:["Shakespeare se pehle ke educated playwrights (Oxford/Cambridge).","Members: Marlowe, Kyd, Lyly, Greene, Peele, Nashe, Lodge.","Marlowe: Doctor Faustus, Tamburlaine - blank verse ('mighty line').","Kyd: The Spanish Tragedy (revenge tragedy)."]},
{t:"Sonnet",k:["sonnet","petrarchan","shakespearean sonnet","sidney","astrophil"],
 n:["14 lines ka poem.","Petrarchan: octave (abba abba) + sestet (cdecde).","Shakespearean: 3 quatrains + couplet (abab cdcd efef gg).","England me Wyatt aur Surrey ne laya; Sidney: Astrophil and Stella; Spenser: Amoretti."]},
{t:"Gothic Novel",k:["gothic","walpole","otranto","radcliffe","frankenstein","dracula"],
 n:["Horror, mystery, supernatural, old castles, terror.","Horace Walpole: The Castle of Otranto (1764) first gothic novel.","Ann Radcliffe: The Mysteries of Udolpho. Mary Shelley: Frankenstein (1818). Bram Stoker: Dracula (1897)."]},

 n:["Reform Acts 1832, 1867, 1884 - vote (franchise) ka daayra badhaya.","1832: rotten boroughs khatam, middle class ko vote.","1867: urban working men; 1884: rural workers.","Literature me social/political reform ka mudda (Dickens, Disraeli)."]},

 n:["Poem me ek speaker kisi silent listener se baat karta hai; speaker ka character khud ke shabdon se khulta hai.","Browning: My Last Duchess, Fra Lippo Lippi. Tennyson: Ulysses.","Eliot: The Love Song of J. Alfred Prufrock (modern version)."]},
{t:"Suffragette Movement",k:["suffrage","suffragette","suffragist","pankhurst","votes for women"],
 n:["Women ke vote ke liye movement (late 19th - early 20th c.).","Emmeline Pankhurst ne WSPU (1903) banaya - 'Deeds not words'.","1918: 30+ age ki women ko vote; 1928: equal franchise."]},
{t:"Stream of Consciousness",k:["stream of consciousness","stream","interior monologue","consciousness","william james"],
 n:["Narrative technique jisme character ke thoughts ka continuous flow dikhaya jata hai.","Term: William James (psychologist).","Joyce: Ulysses (Molly Bloom's soliloquy). Woolf: Mrs Dalloway, To the Lighthouse. Dorothy Richardson bhi."]},
{t:"The Postcolonial Condition & Literature",k:["postcolonial","post-colonial","post colonial","colonial","said","orientalism","achebe","empire writes back"],
 n:["Colonialism ke baad ki identity, language, resistance, hybridity.","Edward Said: Orientalism (1978). Homi Bhabha: hybridity. Spivak: 'Can the Subaltern Speak?'","Writers: Chinua Achebe (Things Fall Apart), Rushdie, Naipaul, Ngugi.","'The Empire Writes Back' - colonies ka apna voice."]},
{t:"Bestseller, Social Media & Literature",k:["bestseller","best seller","social media","instagram poetry","digital","blog"],
 n:["Bestseller = bahut zyada bikne wali book; market, marketing, adaptation ka role.","Social media (Instagram poets, Wattpad, blogs) ne publishing aur readers ko badla.","Rupi Kaur jaise 'Instapoets'; e-books, audio-books ka rise."]}
];

const out = document.getElementById("out");
const st  = document.getElementById("status");
const txt = document.getElementById("txt");
const mic = document.getElementById("mic");

function find(q){
  q = q.toLowerCase();
  let best = null, score = 0;
  for(const d of DB){
    let s = 0;
    for(const key of d.k) if(q.includes(key)) s += key.length;
    if(s > score){ score = s; best = d; }
  }
  return best;
}

function ask(q){
  q = (q || "").trim();
  if(!q) return;

  // mic band karo taaki app apni awaaz na sune
  if(rec && on){ try{ rec.abort(); }catch(e){} }
  on = false;
  mic.classList.remove("on");

  const d = find(q);
  let html, spoken;
  if(d){
    html = '<div class="note"><div class="q">🗣 ' + q + '</div><h3>' + d.t + '</h3><ul>' +
           d.n.map(x => '<li>' + x + '</li>').join('') + '</ul></div>';
    spoken = d.t + ". " + d.n.join(". ");
  }else{
    spoken = "Note nahi mila. Dobara bolo.";
    html = '<div class="note"><div class="q">🗣 ' + q + '</div>Is topic ka note nahi mila. Syllabus ka topic likho ya dobara bolo.</div>';
  }
  out.insertAdjacentHTML("afterbegin", html);
  txt.value = "";
  st.textContent = "";
  if(document.getElementById("speak").checked) say(spoken);
}

function say(t){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t.replace(/[→•]/g, " "));
  u.lang = document.getElementById("lang").value;
  u.rate = 0.95;
  speechSynthesis.speak(u);
}

// ===== VOICE INPUT =====
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, on = false;

function toggleMic(){
  if(!SR){ st.textContent = "Is browser me voice support nahi hai. Chrome use karo."; return; }
  if(on){ rec.stop(); return; }
  if("speechSynthesis" in window) speechSynthesis.cancel();

  rec = new SR();
  rec.lang = document.getElementById("lang").value;
  rec.interimResults = true;
  rec.continuous = false;

  rec.onstart = () => {
    on = true;
    mic.classList.add("on");
    st.textContent = "Sun raha hoon... topic bolo 🎤";
  };
  rec.onresult = e => {
    let s = "";
    for(const r of e.results) s += r[0].transcript;
    txt.value = s;
    if(e.results[e.results.length - 1].isFinal) ask(s);
  };
  rec.onerror = e => {
    st.textContent = "Mic error: " + e.error + " (mic permission allow karo)";
  };
  rec.onend = () => {
    on = false;
    mic.classList.remove("on");
  };
  rec.start();
}

txt.addEventListener("keydown", e => { if(e.key === "Enter") ask(txt.value); });
</script>

  </html>
